name: AI News

on:
  push:
    branches:
      - main
  schedule:
    # 09:17 Asia/Shanghai. Avoid the top of the hour because GitHub may drop busy scheduled runs.
    - cron: "17 1 * * *"
    # Sunday 20:17 Asia/Shanghai.
    - cron: "17 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - all
      send:
        description: "Send Enterprise WeChat push"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  collect-render-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://supercup.github.io/AI-News/

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily collection
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 1 * * *' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'all') || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-daily]') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SEARCH_TAVILY: ${{ secrets.SEARCH_TAVILY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}
          BING_SEARCH_ENDPOINT: ${{ vars.BING_SEARCH_ENDPOINT }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://supercup.github.io/AI-News' }}
        run: python scripts/run_daily.py

      - name: Run weekly digest
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 12 * * 0' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'weekly' || inputs.mode == 'all') || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-weekly]') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://supercup.github.io/AI-News' }}
        run: python scripts/run_weekly.py

      - name: Render site when no collection step ran
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'daily' && inputs.mode != 'weekly' && inputs.mode != 'all' }}
        run: python scripts/render_site.py

      - name: Commit generated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update AI news archive"
            git push
          fi

      - name: Ensure GitHub Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages")
          set -e
          if [ "$code" = "404" ]; then
            create_response=$(curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/pages" \
              -d '{"source":{"branch":"main","path":"/docs"}}' \
              -w "\n%{http_code}")
            create_code=$(printf "%s" "$create_response" | tail -n 1)
            create_body=$(printf "%s" "$create_response" | sed '$d')
            if [ "$create_code" != "201" ] && [ "$create_code" != "200" ] && [ "$create_code" != "409" ]; then
              printf "%s\n" "$create_body"
              echo "::warning::GitHub Pages site could not be created automatically. Enable Pages from Settings > Pages using main /docs."
            fi
          elif [ "$code" != "200" ]; then
            cat /tmp/pages.json
            echo "::warning::GitHub Pages status could not be verified. Enable Pages from Settings > Pages using main /docs if the site is not live."
          fi

      - name: Send daily WeCom push
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 1 * * *' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'all') || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-daily]')) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.send == true || github.event_name == 'push' && contains(github.event.head_commit.message, '[send]')) }}
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/send_latest.py daily

      - name: Send weekly WeCom push
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 12 * * 0' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'weekly' || inputs.mode == 'all') || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-weekly]')) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.send == true || github.event_name == 'push' && contains(github.event.head_commit.message, '[send]')) }}
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/send_latest.py weekly
