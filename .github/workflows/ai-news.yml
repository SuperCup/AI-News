name: AI News

on:
  schedule:
    # 09:00 Asia/Shanghai
    - cron: "0 1 * * *"
    # Sunday 20:00 Asia/Shanghai
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - all
      send:
        description: "Send Enterprise WeChat push"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  collect-render-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily collection
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'all') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}
          BING_SEARCH_ENDPOINT: ${{ vars.BING_SEARCH_ENDPOINT }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://supercup.github.io/AI-News' }}
        run: python scripts/run_daily.py

      - name: Run weekly digest
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'weekly' || inputs.mode == 'all') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://supercup.github.io/AI-News' }}
        run: python scripts/run_weekly.py

      - name: Render site when no collection step ran
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'daily' && inputs.mode != 'weekly' && inputs.mode != 'all' }}
        run: python scripts/render_site.py

      - name: Commit generated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update AI news archive"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send daily WeCom push
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'all')) && (github.event_name == 'schedule' || inputs.send == true) }}
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/send_latest.py daily

      - name: Send weekly WeCom push
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'weekly' || inputs.mode == 'all')) && (github.event_name == 'schedule' || inputs.send == true) }}
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/send_latest.py weekly
